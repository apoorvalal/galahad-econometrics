[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "galahad-econometrics"
version = "0.1.0"
description = "Small, exact-Hessian econometric estimators backed by GALAHAD"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.0", "scipy>=1.14", "galahad-optrove>=5.5.3,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "threadpoolctl>=3"]

[tool.hatch.build.targets.wheel]
packages = ["src/galahad_econometrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
