[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "galahad-econometrics"
version = "0.1.0"
description = "Small, exact-Hessian econometric estimators backed by GALAHAD"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.0", "scipy>=1.14", "galahad-optrove>=5.5.3,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "threadpoolctl>=3"]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "threadpoolctl>=3",
]
autodiff = ["jax[cpu]>=0.4.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/galahad_econometrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
